<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MCQ Bank — Elevate to CMA Harshit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- New Fonts: Outfit (Headings) & Inter (Body) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Light Theme Variables */
  --bg: #F8FAFC;
  --card-bg: #FFFFFF;
  --text-main: #1E293B;
  --text-muted: #64748B;
  --primary: #0D9488; /* Teal */
  --primary-light: #CCFBF1;
  --accent: #38BDF8; /* Sky Blue */
  --success: #10B981;
  --error: #EF4444;
  --border: #E2E8F0;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
  --radius: 16px;
  --radius-sm: 12px;
}

/* Dark Theme Variables */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A;
    --card-bg: #1E293B;
    --text-main: #F1F5F9;
    --text-muted: #94A3B8;
    --primary: #2DD4BF;
    --primary-light: #134E4A;
    --accent: #38BDF8;
    --border: #334155;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.3);
  }
}

[data-theme="dark"] {
  --bg: #0F172A;
  --card-bg: #1E293B;
  --text-main: #F1F5F9;
  --text-muted: #94A3B8;
  --primary: #2DD4BF;
  --primary-light: #134E4A;
  --accent: #38BDF8;
  --border: #334155;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  transition: background 0.3s ease, color 0.3s ease;
  padding-bottom: 40px;
}

h1, h2, h3, .btn-text { font-family: 'Outfit', sans-serif; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-weight: 800; font-size: 1.2rem; color: var(--primary); letter-spacing: -0.5px; }
.theme-toggle {
  background: var(--card-bg); border: 1px solid var(--border);
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; box-shadow: var(--shadow-sm);
}

/* Container */
.container { max-width: 600px; margin: 0 auto; padding: 16px; }

/* Hero Card */
.hero-card {
  background: linear-gradient(135deg, var(--primary), #0F766E);
  color: white; padding: 24px; border-radius: var(--radius);
  box-shadow: var(--shadow-md); margin-bottom: 24px; position: relative; overflow: hidden;
}
.hero-card::after {
  content: ''; position: absolute; top: -20px; right: -20px;
  width: 100px; height: 100px; background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.hero-title { margin: 0 0 8px; font-size: 1.5rem; font-weight: 800; }
.hero-sub { margin: 0; opacity: 0.9; font-size: 0.95rem; }

/* Section Headers */
.section-title {
  font-size: 1.1rem; font-weight: 700; margin: 24px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title span { color: var(--primary); }

/* Paper Grid */
.paper-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.paper-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}
.paper-card:active { transform: scale(0.98); }
.paper-icon {
  width: 48px; height: 48px; background: var(--primary-light);
  color: var(--primary); border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
}
.paper-info { flex: 1; }
.paper-name { font-weight: 700; font-size: 1rem; margin: 0; color: var(--text-main); }
.paper-meta { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
.arrow { color: var(--text-muted); font-size: 1.2rem; }

/* Quiz Interface */
.quiz-view { display: none; animation: slideIn 0.3s ease; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.progress-bar-container {
  width: 100%; height: 6px; background: var(--border); border-radius: 10px; margin-bottom: 20px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease;
}
.question-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.q-number { font-size: 0.85rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.q-text { font-size: 1.1rem; font-weight: 600; margin: 12px 0 0; line-height: 1.5; }

.options-list { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px; text-align: left;
  font-size: 1rem; color: var(--text-main); position: relative;
  transition: all 0.2s; display: flex; align-items: center; gap: 12px;
}
.option-btn:disabled { cursor: default; }
.option-letter {
  width: 32px; height: 32px; border-radius: 8px; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.9rem; color: var(--text-muted);
}

/* States */
.option-btn.correct {
  border-color: var(--success); background: #ECFDF5;
}
.option-btn.correct .option-letter { background: var(--success); color: white; }
.option-btn.wrong {
  border-color: var(--error); background: #FEF2F2;
}
.option-btn.wrong .option-letter { background: var(--error); color: white; }
.option-btn.disabled { opacity: 0.6; pointer-events: none; }

.explanation {
  background: var(--primary-light); border-left: 4px solid var(--primary);
  padding: 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-top: 16px; font-size: 0.95rem; display: none;
}
.show-explanation { display: block !important; animation: fadeIn 0.3s; }

.nav-buttons { display: flex; gap: 12px; margin-top: 24px; }
.btn {
  flex: 1; padding: 14px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 1rem; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3); }
.btn-secondary { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Results */
.result-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 32px 20px; text-align: center;
  box-shadow: var(--shadow-md); margin-top: 20px;
}
.score-circle {
  width: 120px; height: 120px; border-radius: 50%;
  background: conic-gradient(var(--primary) 0%, var(--border) 0%);
  margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.score-inner {
  width: 100px; height: 100px; background: var(--card-bg);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 800; color: var(--primary);
}

/* Animations */
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Confetti Canvas */
#confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="header">
  <div class="logo">Elevate to CMA</div>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
</div>

<!-- Main Menu View -->
<div id="home-view" class="container">
  <div class="hero-card">
    <h1 class="hero-title">MCQ Bank</h1>
    <p class="hero-sub">Practice for ICMAI Intermediate Exams with updated questions and instant explanations.</p>
  </div>

  <div class="section-title"><span>📚</span> Papers Available</div>
  
  <div class="paper-grid">
    <!-- Paper 1 -->
    <div class="paper-card" onclick="startQuiz('ble-june26')">
      <div class="paper-icon">⚖️</div>
      <div class="paper-info">
        <h3 class="paper-name">Business Laws & Ethics</h3>
        <p class="paper-meta">June 2026 • 5 Questions</p>
      </div>
      <div class="arrow">›</div>
    </div>
    
    <!-- Paper 2 -->
    <div class="paper-card" onclick="startQuiz('ble-dec25')">
      <div class="paper-icon">📜</div>
      <div class="paper-info">
        <h3 class="paper-name">Business Laws & Ethics</h3>
        <p class="paper-meta">December 2025 • 5 Questions</p>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>
</div>

<!-- Quiz View -->
<div id="quiz-view" class="container quiz-view">
  <div class="quiz-header">
    <button class="btn btn-secondary" style="flex:0 0 auto; padding: 8px 16px;" onclick="exitQuiz()">✕ Exit</button>
    <div style="font-weight:700" id="quiz-progress-text">1/5</div>
  </div>
  
  <div class="progress-bar-container">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div id="question-container">
    <!-- Question injected here -->
  </div>

  <div class="nav-buttons">
    <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()">← Prev</button>
    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next →</button>
  </div>
</div>

<!-- Result View -->
<div id="result-view" class="container quiz-view" style="text-align: center;">
  <div class="result-card">
    <h2 style="margin-top:0">Quiz Completed!</h2>
    <p style="color:var(--text-muted)">Here is how you performed</p>
    
    <div class="score-circle" id="score-circle">
      <div class="score-inner" id="score-text">0%</div>
    </div>
    
    <p id="score-message" style="font-weight:600; margin-bottom:24px;"></p>
    
    <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
    <button class="btn btn-secondary" onclick="goHome()" style="margin-top:12px; width:100%">Back to Home</button>
  </div>
</div>

<script>
// --- Data ---
const papers = {
  'ble-june26': [
    { q: "According to the Indian Contract Act, 1872, which of the following is NOT an essential element of a valid contract?", options: ["Offer and Acceptance", "Free Consent", "Legal Capacity", "Written Document Only"], answer: 3, explanation: "A contract can be oral or written. Written form is only required for specific contracts listed in the Act." },
    { q: "Which section of the Companies Act, 2013 deals with the 'Doctrine of Lifting the Corporate Veil'?", options: ["Section 4", "Section 8", "No specific section; it's a judicial doctrine", "Section 2(1)(c)"], answer: 2, explanation: "It is primarily a judicial doctrine developed through court decisions, though specific provisions exist for fraud investigations." },
    { q: "Under the Factories Act, 1948, the maximum working hours for an adult per week is:", options: ["40 hours", "48 hours", "50 hours", "60 hours"], answer: 1, explanation: "Section 51 states that no adult shall work more than 48 hours in a week." },
    { q: "Who is considered a 'Key Managerial Personnel' under the Companies Act, 2013?", options: ["Only the CEO", "CEO, CFO, Whole-time Director, Company Secretary", "Only the Managing Director", "All Senior Managers"], answer: 1, explanation: "Section 2(51) defines KMP to include CEO, CFO, WD, CS, and MD if applicable." },
    { q: "The Consumer Protection Act, 2019 replaced which earlier act?", options: ["Consumer Protection Act, 1986", "Consumer Protection Act, 1990", "Trade Marks Act, 1999", "Sale of Goods Act, 1930"], answer: 0, explanation: "The 2019 Act completely replaced the 1986 Act to address new challenges like e-commerce." }
  ],
  'ble-dec25': [
    { q: "An agreement in restraint of marriage is:", options: ["Always void", "Void if total restraint", "Valid", "Voidable at option of party"], answer: 1, explanation: "Section 26 says any agreement in restraint of marriage of any person, other than a minor, is void." },
    { q: "Minimum number of members for a Private Company is:", options: ["2", "7", "1", "50"], answer: 0, explanation: "Section 2(17) defines a private company requiring minimum 2 members." },
    { q: "Day of 'Shravan Purnima' is celebrated as:", options: ["Factory Day", "Workers' Day", "Safety Day", "Independence Day"], answer: 0, explanation: "Factories Day is observed on Shravan Purnima to commemorate the first Factory Commission." },
    { q: "Insolvency and Bankruptcy Code was enacted in:", options: ["2013", "2015", "2016", "2018"], answer: 2, explanation: "The IBC was enacted in 2016 to consolidate laws related to insolvency resolution." },
    { q: "Which authority adjudicates disputes under the Competition Act, 2002?", options: ["Supreme Court", "Competition Commission of India (CCI)", "NCLT", "SEBI"], answer: 1, explanation: "The CCI is the statutory body established to enforce the provisions of the Act." }
  ]
};

// --- State ---
let currentPaperId = null;
let currentIndex = 0;
let userAnswers = []; // Array of indices or null
let score = 0;

// --- DOM Elements ---
const homeView = document.getElementById('home-view');
const quizView = document.getElementById('quiz-view');
const resultView = document.getElementById('result-view');
const questionContainer = document.getElementById('question-container');
const progressFill = document.getElementById('progress-fill');
const progressText = document.getElementById('quiz-progress-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const scoreCircle = document.getElementById('score-circle');
const scoreText = document.getElementById('score-text');
const scoreMessage = document.getElementById('score-message');

// --- Functions ---

function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-toggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

// Load saved theme
(function() {
  const saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.querySelector('.theme-toggle').textContent = saved === 'dark' ? '☀️' : '🌙';
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
     // Optional: default to dark if system prefers
     // document.documentElement.setAttribute('data-theme', 'dark');
     // document.querySelector('.theme-toggle').textContent = '☀️';
  }
})();

function startQuiz(paperId) {
  currentPaperId = paperId;
  currentIndex = 0;
  userAnswers = new Array(papers[paperId].length).fill(null);
  score = 0;
  
  homeView.style.display = 'none';
  resultView.style.display = 'none';
  quizView.style.display = 'block';
  
  renderQuestion();
}

function exitQuiz() {
  if(confirm("Are you sure you want to quit? Your progress will be lost.")) {
    goHome();
  }
}

function goHome() {
  quizView.style.display = 'none';
  resultView.style.display = 'none';
  homeView.style.display = 'block';
}

function restartQuiz() {
  startQuiz(currentPaperId);
}

function renderQuestion() {
  const data = papers[currentPaperId];
  const qData = data[currentIndex];
  
  // Update Progress
  const pct = ((currentIndex + 1) / data.length) * 100;
  progressFill.style.width = `${pct}%`;
  progressText.textContent = `${currentIndex + 1}/${data.length}`;
  
  // Build HTML
  let html = `
    <div class="question-card">
      <div class="q-number">Question ${currentIndex + 1}</div>
      <p class="q-text">${qData.q}</p>
    </div>
    <div class="options-list">
  `;
  
  qData.options.forEach((opt, i) => {
    let classes = 'option-btn';
    let disabled = '';
    let icon = '';
    
    // Check if already answered
    if (userAnswers[currentIndex] !== null) {
      disabled = 'disabled';
      if (i === qData.answer) {
        classes += ' correct';
        icon = '✓';
      } else if (i === userAnswers[currentIndex]) {
        classes += ' wrong';
        icon = '✗';
      }
    }
    
    html += `
      <button class="${classes}" onclick="handleAnswer(${i})" ${disabled}>
        <div class="option-letter">${String.fromCharCode(65+i)}</div>
        <div>${opt}</div>
        ${icon ? `<div style="margin-left:auto; font-weight:bold">${icon}</div>` : ''}
      </button>
    `;
  });
  
  html += `</div>`;
  
  // Explanation
  if (userAnswers[currentIndex] !== null) {
    html += `
      <div class="explanation show-explanation">
        <strong>💡 Explanation:</strong><br>
        ${qData.explanation}
      </div>
    `;
  }
  
  questionContainer.innerHTML = html;
  
  // Buttons state
  prevBtn.disabled = currentIndex === 0;
  nextBtn.textContent = (currentIndex === data.length - 1 && userAnswers[currentIndex] !== null) ? 'Finish' : 'Next →';
  nextBtn.disabled = userAnswers[currentIndex] === null;
}

function handleAnswer(optIndex) {
  if (userAnswers[currentIndex] !== null) return; // Already answered
  
  const data = papers[currentPaperId];
  const correctIndex = data[currentIndex].answer;
  
  userAnswers[currentIndex] = optIndex;
  
  if (optIndex === correctIndex) {
    score++;
    triggerConfetti();
  }
  
  renderQuestion();
}

function nextQuestion() {
  if (currentIndex < papers[currentPaperId].length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function finishQuiz() {
  quizView.style.display = 'none';
  resultView.style.display = 'block';
  
  const total = papers[currentPaperId].length;
  const percentage = Math.round((score / total) * 100);
  
  // Animate Score Circle
  scoreCircle.style.background = `conic-gradient(var(--primary) ${percentage}%, var(--border) ${percentage}%)`;
  scoreText.textContent = `${percentage}%`;
  
  // Message
  let msg = "";
  if (percentage >= 80) msg = "🌟 Outstanding! You're ready.";
  else if (percentage >= 60) msg = "👍 Good job! Keep practicing.";
  else msg = "📚 Keep studying! You'll get there.";
  
  scoreMessage.textContent = `${msg} (${score}/${total} Correct)`;
  
  if (percentage >= 80) triggerConfetti(true);
}

// Simple Confetti Effect
function triggerConfetti(isLong = false) {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const particles = [];
  const colors = ['#0D9488', '#38BDF8', '#F472B6', '#FBBF24'];
  
  for(let i=0; i<100; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      size: Math.random() * 5 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 100
    });
  }
  
  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let active = false;
    
    particles.forEach(p => {
      if(p.life > 0) {
        active = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2; // gravity
        p.life -= 1;
        
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
    });
    
    if(active) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  
  animate();
}
</script>
</body>
</html>
