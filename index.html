dius:6px;font-size:11px;display:none}.qcard.show .exp{display:block}.bar{height:4px;background:#ddd;position:fixed;top:0;left:0;width:100%;z-index:100}.bar-inner{height:100%;background:linear-gradient(90deg,#10b981,#3b82f6);width:0%}</style></head><body><div class="bar"><div class="bar-inner" id="bar"></div></div><div class="top"><h1>📚 CMA INTER - MCQ BANK WITH CORRECT ANSWERS<br>Paper 5 • Paper 6 • Paper 7 • Paper 8</h1><p>CODE 1-4 = Option A-B-C-D | Source: Institute Answer Sheets (End of PDF)</p></div><div class="stats"><span>Total: <b id="tot">0</b></span><span>Attempted: <b id="att">0</b></span><span>Correct: <b id="cor">0</b></span><span>Score: <b id="sc">0%</b></span></div><div class="tabs" id="tabs"></div><div class="controls"><input id="search" placeholder="Search question..."><select id="filter"><option value="all">All</option><option value="unattempted">Unattempted</option><option value="correct">Correct Only</option><option value="wrong">Wrong Only</option></select><button onclick="shuffle()">Shuffle</button><button onclick="reset()">Reset</button></div><div id="container" style="max-width:860px;margin:auto;padding-bottom:80px"></div><script>
const DATA = {
"P5 Business Laws": [{q:"Right to Property is a:",o:["Fundamental Right","Legal Right","Constitutional Right","Natural Right"],a:2},{q:"The Constitution of India describes India as:",o:["Federation","Union of states","Quasi federal","Unitary"],a:1},{q:"State who is competent to contracts:",o:["A minor","A person of sound mind","A lunatic","A pardanashin woman"],a:1},{q:"When are essential elements of a valid contract:",o:["Offer and acceptance","lawful consideration","Capacity","All of the above"],a:3},{q:"A contract is:",o:["a legal obligation","An agreement plus a legal obligation","Consensus ad idem","An agreement plus legal object"],a:1},{q:"An unlawful act by which an intending purchaser is prevented from bidding is known as",o:["decoy","ducking","damping","none"],a:2},{q:"Which section deals with proxies?",o:["Section 101","Section 107","Section 106","Section 105"],a:3},{q:"Which company is not required to hold an AGM?",o:["Private","Public","One Person Company","Listed"],a:2},{q:"Double Jeopardy protects against?",o:["Multiple crimes","Harsh punishment","Prosecuted and punished for same offence more than once","Arrest without warrant"],a:2},{q:"Self-management in EI controls:",o:["Social awareness","Self-awareness","Relationship management","Impulsive feelings and behaviors"],a:3}],
"P6 Financial Accounting": [{q:"Which is not a method of charging depreciation?",o:["Sinking Fund","Sum of years Digit","Working hours","Asset's Life-cycle Method"],a:3},{q:"A resource owned for future profit is known as",o:["Capital","Asset","Liability","Surplus"],a:1},{q:"Outward Invoice is source document of",o:["Purchase Book","Sales Book","Return Inward","Return Outward"],a:1},{q:"Which is of capital nature?",o:["Commission","Cost of repairs","Rent","Wages for installation of machinery"],a:3},{q:"Which is not Fundamental Accounting Assumption?",o:["Going Concern","Consistency","Accrual","Materiality"],a:3},{q:"An obligation which may or may not materialize is:",o:["Loss","Asset","Contingent Liability","None"],a:2},{q:"Bill discount: 10000 for 3 months at 15% discount amount?",o:["Rs.125","Rs.250","Rs.375","None"],a:2},{q:"If average inventory 125000 and closing 10000 less than opening, closing inventory?",o:["135000","115000","130000","120000"],a:3},{q:"Income and Expenditure Account is a:",o:["Nominal Account","Real Account","Personal","Artificial Personal"],a:0},{q:"Receipts and Payments account is a",o:["Nominal","Real Account","Personal","Artificial"],a:1},{q:"Opening and Closing Debtors 30000 and 40000, Cash collected 240000, Discount 15000, Bad Debts 10000. Credit sales?",o:["255000","245000","295000","275000"],a:3},{q:"Full form of IFRS",o:["Indian Financial Reporting Standards","International Financial Reporting Standards","International Financials Reporting","Indian Financial Reporting Standard"],a:1},{q:"Areas involving different accounting policies is/are",o:["Valuation of inventories","Treatment of intangible","Recognition of profit on long-term contracts","All of these"],a:3},{q:"As per AS 22 example of permanent difference is",o:["Exempt Income","Disallowed Expenses","Enhanced Deduction","All of these"],a:3},{q:"Borrowing cost includes",o:["Debenture Interest","Preference Dividend","Equity Dividend","All"],a:0},{q:"Grants which are in nature of Promoter's Contribution is accounted under",o:["Capital Approach","Income Approach","Any of 1 and 2","None"],a:0},{q:"As per AS 11 Monetary Items excludes",o:["Cash","Receivables","Payables","Inventories"],a:3}],
"P7 Taxation": [{q:"Safeguard duties, anti-dumping duties are rebatable as drawback in terms of section ____ of Customs Act",o:["74","75","76","75A"],a:1},{q:"Following is not a head of income:",o:["Salary","House Property","Income from Interest on securities","Business"],a:2},{q:"Income tax is a",o:["Indirect Tax","Service Tax","Direct Tax","GST"],a:2},{q:"Which is NOT eligible for Section 44AD?",o:["Resident individual small retail","Partnership firm grocery","Person engaged in plying, hiring, leasing goods carriage","HUF small trading"],a:2},{q:"Percentage of turnover of Presumptive income under 44AD is deemed to be:",o:["10%","8% (6% for digital)","12%","15%"],a:1},{q:"Which person cannot opt for Section 44AD?",o:["Resident Individual","HUF","Partnership Firm","LLP"],a:3},{q:"Section 44AE trucks limit:",o:["Less than 10 trucks","more Than 10","less than 9","Less than 5"],a:0},{q:"Employer's contribution to RPF shall be:",o:["Fully Exempt","Exempt upto 12% p.a","Fully Taxable","Exempt upto 9.5%"],a:1},{q:"Interest on Employer's Contribution credited to unrecognised PF is:",o:["Fully Taxable","Fully Exempt","Exempt upto 8.5%","Neither exempt nor taxable in year of accrual"],a:3},{q:"Standard deduction for salaried AY 2025-26?",o:["50000","75000","60000","40000"],a:1}],
"P8 Cost Accounting": [{q:"Cost Accounting Records include: Job cost sheets, cost ledgers, cost memorandum",o:["Job sheets","cost ledgers","cost memorandum","All"],a:1},{q:"Which is not covered under CAS-1: Classification of Cost?",o:["By nature","By function","By variability","Cost by ownership"],a:3},{q:"Joint costs before separation dealt under:",o:["CAS-19","CAS-3","CAS-6","CAS-7"],a:0},{q:"Material cost as per CAS-6: 100000 + 5000 freight + 2000 handling =",o:["100000","105000","107000","102000"],a:2},{q:"Which standard deals with manufacturing Cost of excisable goods?",o:["CAS-20","CAS-21","CAS-2","CAS-22"],a:3},{q:"Which is not included in cost sheet?",o:["Factory overhead","Interest paid","Direct material","Direct labour"],a:1},{q:"What is prime cost?",o:["Total direct cost only","Total indirect","Factory cost","Cost of production"],a:0},{q:"In Reconciliation, expenses shown only in financial accounts are:",o:["Added to financial profit","Deducted","Ignored","Added to costing profit"],a:3},{q:"Difference between cost control and cost reduction?",o:["Cost control is preventive; cost reduction is corrective","Both same","Control is corrective","Reduction is preventive"],a:0},{q:"When cost accounts show under absorption, it means:",o:["Actual overhead > Absorbed overhead","Actual < Absorbed","They are equal","No effect"],a:0},{q:"In cost accounts depreciation 10% on 200000, financial 15%. Difference?",o:["10000 higher in cost accounts","10000 lower","20000 higher","No difference"],a:0},{q:"Margin of safety represents:",o:["Fixed costs","Difference between actual sales and break-even sales","Variable costs","Profit margin"],a:1},{q:"Break even 6000 units, selling price 90, variable 40, fixed costs?",o:["200000","250000","300000","350000"],a:2},{q:"Budget which gives budgeted cost for any level of activity is known as:",o:["Fixed budget","Master budget","Cash budget","Flexible budget"],a:3},{q:"P/v ratio 50% and margin of safety 40%. Present sales 30,00,000 then BEP:",o:["1200000","1800000","2000000","2400000"],a:1}]
};
let curPaper=Object.keys(DATA)[0];let state=JSON.parse(localStorage.getItem('cma_state')||'{}');
function initTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';Object.keys(DATA).forEach(p=>{const b=document.createElement('div');b.className='tab'+(p===curPaper?' active':'');b.textContent=p+` (${DATA[p].length})`;b.onclick=()=>{curPaper=p;initTabs();render();};tabs.appendChild(b);});}
function render(){const list=getFiltered();document.getElementById('tot').textContent=DATA[curPaper].length;const cont=document.getElementById('container');cont.innerHTML='';list.forEach((qObj,i)=>{const realIdx=DATA[curPaper].indexOf(qObj);const key=curPaper+'_'+realIdx;const s=state[key]||{};const card=document.createElement('div');card.className='qcard'+(s.ans!==undefined?(s.ans===qObj.a?' correct':' wrong'):'')+(s.show?' show':'');card.innerHTML=`<div class="q">${realIdx+1}. ${qObj.q}</div><div class="opts">${qObj.o.map((op,idx)=>{let cls='opt';if(s.ans!==undefined){if(idx===qObj.a)cls+=' correct-opt';if(idx===s.ans&&s.ans!==qObj.a)cls+=' wrong-opt';}return `<div class="${cls}" onclick="check(${realIdx},${idx})"><b>${String.fromCharCode(65+idx)}.</b> ${op}</div>`}).join('')}</div><div class="exp">✅ Correct: ${String.fromCharCode(65+qObj.a)} - ${qObj.o[qObj.a]} | CODE ${qObj.a+1}</div>`;cont.appendChild(card);});updateStats();}
function getFiltered(){const term=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;return DATA[curPaper].filter((q,i)=>{const key=curPaper+'_'+i;const s=state[key];if(term&&!q.q.toLowerCase().includes(term)&&!q.o.join(' ').toLowerCase().includes(term))return false;if(f==='unattempted'&&s)return false;if(f==='correct'&&(!s||s.ans!==q.a))return false;if(f==='wrong'&&(!s||s.ans===q.a))return false;return true;});}
function check(realIdx,optIdx){const key=curPaper+'_'+realIdx;state[key]={ans:optIdx,show:true};localStorage.setItem('cma_state',JSON.stringify(state));render();}
function updateStats(){let att=0,cor=0;DATA[curPaper].forEach((q,i)=>{const s=state[curPaper+'_'+i];if(s){att++;if(s.ans===q.a)cor++;}});document.getElementById('att').textContent=att;document.getElementById('cor').textContent=cor;document.getElementById('sc').textContent=att?Math.round(cor/att*100)+'%':'0%';document.getElementById('bar').style.width=(att/DATA[curPaper].length*100)+'%';}
function shuffle(){DATA[curPaper].sort(()=>Math.random()-0.5);render();}
function reset(){if(confirm('Reset '+curPaper+'?')){Object.keys(state).forEach(k=>{if(k.startsWith(curPaper))delete state[k];});localStorage.setItem('cma_state',JSON.stringify(state));render();}}
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);initTabs();render();
</script></body></html>
